plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.walle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.walle'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    // نموذج ML Kit المضمّن داخل التطبيق لتصنيف الصور دون تنزيل نموذج منفصل
    implementation 'com.google.mlkit:image-labeling:17.0.7'
}
