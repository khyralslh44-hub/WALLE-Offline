name: WALL-E Android Build

on:
workflow_dispatch:
push:
paths:
- 'WALLE_Offline_Android_Fixed.zip'

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4


  - name: Install tools
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip curl openjdk-17-jdk

  - name: Extract project
    run: |
      mkdir project
      unzip WALLE_Offline_Android_Fixed.zip -d project
      find project -name settings.gradle -print

  - name: Build APK
    run: |
      curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
      unzip -q /tmp/gradle.zip -d /tmp
      cd "$(dirname "$(find "$GITHUB_WORKSPACE/project" -name settings.gradle | head -1)")"
      /tmp/gradle-8.7/bin/gradle assembleDebug

  - name: Save APK
    uses: actions/upload-artifact@v4
    with:
      name: WALL-E-APK
      path: project/**/build/outputs/apk/debug/*.apk

